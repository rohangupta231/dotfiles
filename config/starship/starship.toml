add_newline = false

format = """
[╭─](bold #58a6ff) $directory$git_branch$git_status$fill$cmd_duration$time
[╰─](bold #58a6ff) $java$nodejs$python$rust$golang$character"""

[fill]
symbol = "─"
style = "#30363d"

[character]
success_symbol = "[❯](bold #3fb950)"
error_symbol = "[❯](bold #ff7b72)"

[directory]
style = "bold #79c0ff"
truncate_to_repo = true
truncation_length = 4
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold #ff7b72"

[git_branch]
symbol = " "
style = "#d2a8ff"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#d29922"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
modified = "✎"
untracked = "✦"
staged = "✚"
deleted = "✖"
renamed = "↪"
stashed = "⚑"
conflicted = "✗"

[cmd_duration]
min_time = 2000
style = "#8b949e"
format = " [$duration]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "#8b949e"
format = " [$time]($style)"

[java]
symbol = " "
style = "#ff7b72"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#3fb950"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#e3b341"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#ffa657"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#39c5cf"
format = "[$symbol$version]($style) "

[package]
disabled = true

[os]
disabled = true

[username]
show_always = false

[hostname]
ssh_only = true
style = "#8b949e"
format = "[@$hostname]($style) "
