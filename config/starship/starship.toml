add_newline = false

format = """
$username\
$hostname\
$directory\
$git_status\
$nodejs\
$python\
$rust\
$java\
$golang\
$cmd_duration\
$status\
$line_break\
$character
"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncate_to_repo = true
truncation_length = 3

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 500
style = "bold dimmed white"

[username]
show_always = false

[hostname]
ssh_only = true
style = "dimmed white"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"
[java]
symbol = " "
style = "bold red"

[status]
disabled = false
format = '[\[$symbol$status\]]($style) '
symbol = "✖"
style = "bold red"

[time]
disabled = false
format = '[$time]($style) '
time_format = "%H:%M"
style = "dimmed white"