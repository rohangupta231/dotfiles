add_newline = false

format = """
[╭─](bold #d97757) $directory$git_branch$git_status$fill$cmd_duration$time
[╰─](bold #d97757) $java$nodejs$python$rust$golang$character"""

[fill]
symbol = "─"
style = "#3a3734"

[character]
success_symbol = "[❯](bold #d97757)"
error_symbol = "[❯](bold #ff6b80)"

[directory]
style = "bold #f0eee6"
truncate_to_repo = true
truncation_length = 4
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold #ff6b80"

[git_branch]
symbol = " "
style = "#b1b9f9"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#ffc107"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
modified = "✎"
untracked = "✦"
staged = "✚"
deleted = "✖"
renamed = "↪"
stashed = "⚑"
conflicted = "✗"

[cmd_duration]
min_time = 2000
style = "#8a8580"
format = " [$duration]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "#8a8580"
format = " [$time]($style)"

[java]
symbol = " "
style = "#ff6b80"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#4eba65"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#ffc107"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#e8a07f"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#48968c"
format = "[$symbol$version]($style) "

[package]
disabled = true

[os]
disabled = true

[username]
show_always = false

[hostname]
ssh_only = true
style = "#8a8580"
format = "[@$hostname]($style) "
