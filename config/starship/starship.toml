# Colors use ANSI names, so the prompt follows the terminal theme (see `theme`)
add_newline = false

format = """
[╭─](bold blue) $directory$git_branch$git_status$fill$cmd_duration$time
[╰─](bold blue) $java$nodejs$python$rust$golang$character"""

[fill]
symbol = "─"
style = "bright-black"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold bright-blue"
truncate_to_repo = true
truncation_length = 4
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold red"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "yellow"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
modified = "✎"
untracked = "✦"
staged = "✚"
deleted = "✖"
renamed = "↪"
stashed = "⚑"
conflicted = "✗"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = " [$duration]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = " [$time]($style)"

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bright-yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bright-red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[package]
disabled = true

[os]
disabled = true

[username]
show_always = false

[hostname]
ssh_only = true
style = "bright-black"
format = "[@$hostname]($style) "
