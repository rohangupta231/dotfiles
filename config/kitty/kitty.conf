# =========================
# Font
# =========================
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0
modify_font      cell_height 110%

# =========================
# Window
# =========================
remember_window_size  no
initial_window_width  140c
initial_window_height 35c
window_padding_width  12 12 10 12
inactive_text_alpha   0.7
confirm_os_window_close 1
enabled_layouts splits,stack
window_border_width 1px
active_border_color   #7aa2f7
inactive_border_color #404765

# =========================
# Cursor / scrollback / misc
# =========================
cursor_shape        block
cursor_blink_interval 0.8
scrollback_lines    10000
copy_on_select      no
enable_audio_bell   no
detect_urls         yes
shell_integration   enabled

# =========================
# Tab bar (bottom, like the old WezTerm setup)
# =========================
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    1
tab_title_max_length 40
tab_title_template  "{index}: {title}"
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #565f89
inactive_tab_background #24283b
tab_bar_background      #1e1e2e

# =========================
# Colors: Tokyo Night (background matches old WezTerm config)
# =========================
foreground            #c0caf5
background            #1e1e2e
selection_foreground  #c0caf5
selection_background  #283457
cursor                #c0caf5
cursor_text_color     #1a1b26
url_color             #73daca

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# =========================
# Keybindings
# =========================
# Clear scrollback + screen
map ctrl+shift+k combine : clear_terminal scrollback active : send_text normal \x0c

# Search scrollback with fzf
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --exact -i --tac

# Pane splitting (Terminator-style), new pane opens in the same directory
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+e launch --location=vsplit --cwd=current

# Pane navigation
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Close pane (asks for confirmation)
map ctrl+shift+w close_window_with_confirmation

# Zoom current pane (toggle stack layout)
map ctrl+shift+z toggle_layout stack

# Tabs (ctrl+shift+arrows are used for panes above)
map ctrl+shift+t new_tab_with_cwd
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab
